[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtsp-timelapse"
version = "0.1.0"
description = "Capture RTSP snapshots and render them into timelapse videos with FFmpeg"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Local project"}]
dependencies = ["PyQt6>=6.6"]

[project.optional-dependencies]
test = ["pytest>=7"]
build = ["pyinstaller>=6.10", "imageio-ffmpeg>=0.6", "PyQt6>=6.6"]

[project.scripts]
timelapse = "timelapse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
timelapse = ["assets/*.jpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
