name: Build desktop applications

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build application
        run: python scripts/build.py --clean
      - name: Verify Windows executable startup
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process -FilePath 'dist\QQQ.exe' -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "QQQ.exe exited during startup verification with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress --yes
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          & $iscc installer\WHXTimelapse.iss
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QQQ-${{ matrix.artifact }}
          path: |
            dist/
            installer-output/
